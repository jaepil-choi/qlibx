schema_version: 1

project:
  name: vqapr
  kind: python-package

canonical_documents:
  product_requirements: docs/vqapr-prd.md
  # 진행 중인 agent-first surface 재설계의 확정된 설계 결정. 이 표면을 건드리기 전에 읽는다.
  surface_design: docs/design/agent-first-surface.md
  # 무엇이 어떻게 잘못되어 있는가 — 관측만. 어느 진단이 살아 있고 어느 것이 뒤집혔는지가
  # 이 색인에 있다. 진단을 새로 하기 전에 여기부터 읽는다.
  diagnostics: docs/diagnostics/README.md
  # 그 진단에 대해 무엇을 어떤 순서로 할 것인가. 단계·인수조건·게이트·위험.
  # 2026-09-03: 수렴 캠페인(09-02)은 완료. 현행은 삭제 캠페인 — Step 0-7, ExecPlan은 Step 4·7.
  # 2026-09-04: 삭제 캠페인 완료(records 141-150). 한 모양 캠페인도 완료.
  # 2026-09-08: 레이어링 캠페인(M0-M8, records 190-198) 완료. import 그래프는 DAG이고
  # tests/boundaries/test_the_layers_hold.py가 그것을 지킨다. 순환 4개 -> 0, 평면 모듈 9 -> 1.
  # 2026-09-09: 현행은 두 시계 캠페인 — Stage 0-5. 레이어링이 "경계가 선명한가"를 닫았고
  # 이것은 "경계가 옳은가"를 묻는다. 설계 근거는 아래 wiring_design, 착수 순서는 이 파일.
  active_campaign: docs/refactoring/2026-09-09-the-two-clocks-campaign.md
  # 두 시계(시장/전략)와 다섯 역할의 배선표. 확장점·시계·목적지·통장의 확정된 계약.
  # 이 표면을 건드리기 전에 읽는다. PRD/architecture 중 뒤집히는 절은 그 문서 §8에 있다.
  wiring_design: docs/design/two-clocks-and-the-wiring-table.md
  # 세션 1~3 인수인계. §7(어디서 막혔는가)만 유효하며, 그 한 절은 값어치가 크다 — 두 번 revert된
  # 마이그레이션이 남긴 "한 단위" 발견이 거기 있다. 나머지, 특히 §8의 작업 순서는 record 104/124가
  # 뒤집었다. 파일 맨 위 경고가 절별 판정을 싣는다. 시작점은 위의 `diagnostics`다.
  # 2026-09-04: 한 모양 캠페인 handoff가 현행. gjc-handoff/는 그 이전 세션(§7만 유효).
  session_handoff: docs/handoff/2026-09-04-one-shape-campaign-handoff.md

non_authoritative_directories:
  - references

commands:
  environment_manager: uv
  install: uv sync
  import: uv run python -c "import vqapr"
  build: uv build
  # Iteration check. Deselects `slow` by default via pyproject's addopts: the slow set is the
  # sample-driven journeys and the showcases, about four minutes of the six-minute whole
  # (record 169: test_all is 1453 tests in 375 s alone, 2026-09-08). The sample panel is
  # shipped synthetic data since record 172; nothing builds it in the suite any more.
  test: uv run pytest tests/ -q
  # Everything, including those thirteen. Required before handoff, release, or any change to
  # run assembly, the record shape, or the scaffolds -- that is what the slow set covers.
  # Since the deletion campaign's Step 0 the slow set also runs eight of the nine showcases
  # (tests/showcases/). The ninth, show_003, reads the gitignored data/DW warehouse and is run
  # by hand before a release: `uv run python showcases/show_003_real_data_long_short/run.py`.
  test_all: uv run pytest tests/ -q -m ""
  # `pyproject.toml` selects E, F, I, UP, B, SIM and RUF, and the tree did not pass them: seven
  # findings stood while no declared command ran the check. A configured gate nobody invokes is
  # not a gate, so it is declared here and the tree is clean as of record 105.
  lint: uv run ruff check src/
  # Static type gate (redesign campaign 2026-09-08, step 0). Scope and mode are in
  # pyproject `[tool.pyright]`; the finding count is the campaign's progress metric.
  typecheck: uv run pyright
  # Release-only gate. The skills a release ships must have their content hashes recorded in
  # `_shipped.json` BEFORE the build, or the next release tells untouched installs they were
  # edited (PRD 11.3). Not part of `test`: between releases the tree ships content that has not
  # been handed out, and this check is meant to fail then.
  # Run `uv run python scripts/record_shipped_skills.py` (no flag) to make it pass.
  release_check: uv run python scripts/record_shipped_skills.py --check
  # Cross-module dead-code pass; ruff is file-local and cannot answer "is this called
  # anywhere". Configuration and the reasoning are in pyproject's `[tool.vulture]`.
  # Not a gate: a report is a candidate, not a verdict, and only a human knows whether a
  # name is unreached because it is dead or because its caller is not written yet. Run it
  # before a cleanup task, not on every edit.
  deadcode: uv run vulture

workflow:
  experiment_root: experiments
  showcase_root: showcases
  implementation_log_root: docs/implementations
  active_plan_root: .agent/plans/active
  completed_plan_root: .agent/plans/completed
  run_state_root: .agent/runs

environment:
  corporate_profile: auto
  explicit_profile_variable: AGENT_CORPORATE_PROFILE
