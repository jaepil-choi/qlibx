schema_version: 1

project:
  name: vqapr
  kind: python-package

canonical_documents:
  product_requirements: docs/vqapr-prd.md
  # 진행 중인 agent-first surface 재설계의 확정된 설계 결정. 이 표면을 건드리기 전에 읽는다.
  surface_design: docs/design/agent-first-surface.md
  # 무엇이 어떻게 잘못되어 있는가 — 관측만. 어느 진단이 살아 있고 어느 것이 뒤집혔는지가
  # 이 색인에 있다. 진단을 새로 하기 전에 여기부터 읽는다.
  diagnostics: docs/diagnostics/README.md
  # 그 진단에 대해 무엇을 어떤 순서로 할 것인가. 단계·인수조건·게이트·위험.
  # 2026-09-03: 수렴 캠페인(09-02)은 완료. 현행은 삭제 캠페인 — Step 0-7, ExecPlan은 Step 4·7.
  # 2026-09-04: 삭제 캠페인 완료(records 141-150). 한 모양 캠페인도 완료.
  # 2026-09-08: 레이어링 캠페인(M0-M8, records 190-198) 완료. import 그래프는 DAG이고
  # tests/boundaries/test_the_layers_hold.py가 그것을 지킨다. 순환 4개 -> 0, 평면 모듈 9 -> 1.
  # 2026-09-09: 두 시계 캠페인 — Stage 0-5. 레이어링이 "경계가 선명한가"를 닫았고
  # 이것은 "경계가 옳은가"를 묻는다. 설계 근거는 아래 wiring_design, 착수 순서는 이 파일.
  # 2026-09-10: 두 시계 캠페인 완료(records 201-214). 설계 §8은 PRD·architecture에 흡수됐다 —
  # 현행 계약은 그 두 문서가 authority이고 wiring_design은 결정의 근거 기록이다. 현행 캠페인 없음.
  # 2026-09-10: 0.9.0.dev1 testbed 보고 7건(docs/issues/089-095) 처리, records 215-220. develop은
  # 0.11.0.dev0 (record 215가 run identity를 바꿈; docs/releases/0.11.0.md).
  # 2026-09-10: 한 루프 캠페인 착수 (branch redesign/one-loop). 시장 시계 한 점의 비용(P1-P5)을 먼저,
  # 그 위에서 루프 하나(L1-L5). 측정은 experiments/exp_221_the_market_clock_cost/.
  # 2026-09-10: 한 루프 캠페인 완료(records 221-229). 3,000 종목 분봉 하루 117 s -> 34 s, 보유 Mark 1.17M -> 3k,
  # 루프 하나(RunLoop·Part·MarketClock), Compliance.observe(call). 현행 캠페인 없음.
  # 2026-09-10: 한 문 캠페인 완료(records 231-234, branch redesign/one-door; 0.11.0 척추 트레이스에서 오너가
  # 연 095-097). EventLoop 삭제, PanelWindow.matrix(), data/validation.py 한 문(등록이 digest를 두고 이후는
  # identity 대조). 0.12.0 (등록 문서 모양이 바뀜; docs/releases/0.12.0.md). 현행 캠페인 없음.
  # 2026-09-10: 한 cube 캠페인 완료(records 235-236, branch redesign/one-cube; testbed 보고 098 — datamodel run 메모리가
  # 종목 수에 비례). panel은 run horizon + 숫자 필드 한 벌(235); --jobs 배치가 dataset마다 cube를 굽고 worker가 mmap,
  # 끝나면 삭제(236). 측정 experiments/exp_236_the_panel_memory/. 0.13.0 (깨지는 변화 없음; docs/releases/0.13.0.md). 현행 캠페인 없음.
  # 2026-09-10: 0.13.0 stamped 뒤 testbed 보고 099 닫음(record 237): ordering 판단이 derived agenda의 날짜 상위집합 대신
  # inclusive_slice(start, end)를 묻는다 — 체결과 결정 사이의 end가 500 대신 통과. 0.13.1 (깨지는 변화 없음; docs/releases/0.13.1.md). 현행 캠페인 없음.
  # 2026-09-10: 한 문(run) 캠페인 완료(records 240-241, branch redesign/one-door-run; 그 앞에 238-239). verify_run 문 하나를
  # check · run · execute · --jobs worker가 지나고(worker가 판정을 받게 됨), RunFacts가 사실을 명령당 한 번 읽는다. 0.14.0
  # (깨지는 변화 없음; docs/releases/0.14.0.md). 남긴 것: RunResources(설계 §5). 현행 캠페인 없음.
  # 2026-09-10: RunResources (record 242, branch redesign/run-resources): 검증이 load한 전략·거래소·규칙과 자른 horizon을
  # run이 그대로 쓴다 — run 시작 때의 재import·재스캔 없음. 0.14.1 (깨지는 변화 없음; docs/releases/0.14.1.md). 현행 캠페인 없음.
  # 2026-09-10: 0.14.2 hotfix (records 243-245, develop 위): 2026-09-10 testbed 보고 셋을 닫음 — dataset.unverified가
  # run이 publish한 dataset에 vqapr run <id> --force를 말함(243); every 거절문이 문법을 말함, y는 12M(244); --limit 0은 0행,
