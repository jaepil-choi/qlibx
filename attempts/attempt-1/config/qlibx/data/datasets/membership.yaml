datasets:
  k200_membership_table:
    kind: table
    sources: [k200_membership]
    query: |
      select available_at, ticker, date, index_weight, is_k200_member
      from k200_membership
    time_field: date
    availability_field: available_at

  k200_membership:
    kind: matrix
    sources: [k200_membership]
    query: |
      select available_at, date as event_date, ticker, is_k200_member
      from k200_membership
    index: event_date
    columns: ticker
    values: is_k200_member
    time_field: event_date
    availability_field: available_at
    dtype: boolean

  index_weight:
    kind: matrix
    sources: [k200_membership]
    query: |
      select available_at, date as event_date, ticker, index_weight
      from k200_membership
    index: event_date
    columns: ticker
    values: index_weight
    time_field: event_date
    availability_field: available_at
    dtype: float64
