registrations:
  daily_market:
    source: data/preprocessed/adjusted_prices.parquet
    output: data/qlibx/daily_market.parquet
    available_at:
      source: date
      offset_days: -1
    ticker: ticker
    information:
      date: date
      adj_base: adj_base
      adj_close: adj_close
      return: return
      trade_volume: trade_volume
      is_trading_halt: is_trading_halt
    primary_key: [date, ticker]
    frequency: daily
    timezone: Asia/Seoul

  k200_membership:
    source: data/preprocessed/k200_members.parquet
    output: data/qlibx/k200_membership.parquet
    available_at:
      source: date
      offset_days: -1
    ticker: ticker
    information:
      date: date
      index_weight: index_weight
      is_k200_member: is_k200_member
    primary_key: [date, ticker]
    frequency: daily
    timezone: Asia/Seoul

  sector_classification:
    source: data/preprocessed/sector_classification.parquet
    output: data/qlibx/sector_classification.parquet
    available_at:
      source: date
      offset_days: 0
    ticker: ticker
    information:
      date: date
      industry_code: industry_code
    primary_key: [date, ticker]
    frequency: mixed_daily_monthly
    timezone: Asia/Seoul
