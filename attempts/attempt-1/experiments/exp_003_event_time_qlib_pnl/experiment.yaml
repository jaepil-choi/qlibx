id: exp_003_event_time_qlib_pnl
status: concluded
created_at: "2026-07-27"
last_verified_at: "2026-07-27"
hypothesis: >-
  The public YAML ConfigDrivenDataLoader can preserve event time separately from available_at and
  supply an actual signed long-short alpha to the public Qlib 0.9.7 execution API without reading
  or modifying upstream user data and without imputing execution prices.
command: uv run python experiments/exp_003_event_time_qlib_pnl/run.py
decision: >-
  PASS. The public YAML loader supplied eight event-time logical datasets for 2025 Q1 without
  reading upstream files directly. All daily rows were available one calendar day before their
  event, no information values or prices were adjusted, and the three upstream SHA-256 values were
  unchanged. The Qlib 0.9.7 matched-capitalization run covered 58 dates and 3,774 complete input-axis
  tickers; the K200-gated signed momentum alpha produced 540 negative cells, 949 actual underlying
  sell orders with 949 positive fills, 542 realized signed-short position rows, zero negative
  composite quantity, and active PnL of 732,258,791.25 on a 1,000,000,000 active book. The
  discarded earlier implementation that indexed research data by availability was removed;
  this experiment is the only current YAML-to-Qlib PnL evidence.
outputs:
  - outputs/summary.json
  - outputs/alpha.parquet
  - outputs/orders.parquet
  - outputs/fills.parquet
  - outputs/signed_positions.parquet
  - outputs/active_account.parquet
  - outputs/composite_account.parquet
  - outputs/baseline_account.parquet
  - outputs/capitalization_events.parquet
supersedes: []
superseded_by: []
