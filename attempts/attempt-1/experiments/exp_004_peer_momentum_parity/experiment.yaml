id: exp_004_peer_momentum_parity
status: concluded
created_at: "2026-07-28"
last_verified_at: "2026-07-28"
hypothesis: >-
  With the exact same point-in-time matrices, qlibx StrategyAgent can reproduce the saved
  integration-codex leave-one-out peer-momentum signed weights, and qlibx signed execution can
  reproduce the integration-codex orders, fills, positions, accounts, and PnL.
command: uv run python experiments/exp_004_peer_momentum_parity/run.py
decision: >-
  PASS_WITH_FLOAT_TOLERANCE. Across 242 dates and 309 tickers, the qlibx StrategyAgent reproduced
  all 74,778 stored integration-codex weights exactly: maximum weight difference 0, no selection
  mismatch, and identical long/short exposure. Orders, signed positions, all three account tables,
  and final active PnL were exact; both final active PnLs were 120,867,255 KRW. The fill table had
  269 non-bit-exact floating-point cells with maximum absolute difference 7.450580596923828e-09,
  while filled quantity and all downstream positions/accounts/PnL were unchanged. The reference
  position adjustment factor was explicitly rejected by qlibx, as required by qlibx's upstream-ETL
  boundary; running with qlibx's unit-factor policy still reproduced the economic result.
outputs:
  - outputs/summary.json
  - outputs/qlibx-alpha.parquet
  - outputs/decision-audit.parquet
  - outputs/qlibx-orders.parquet
  - outputs/qlibx-fills.parquet
  - outputs/qlibx-signed-positions.parquet
  - outputs/qlibx-composite-account.parquet
  - outputs/qlibx-baseline-account.parquet
  - outputs/qlibx-active-account.parquet
supersedes: []
superseded_by: []
