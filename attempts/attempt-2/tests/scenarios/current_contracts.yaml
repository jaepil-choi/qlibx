schema_version: 1
suite: qlibx-current-deterministic-contracts
support_status: current
fixture_policy: deterministic_contract
scenarios:
  - id: UC-DATA-001
    case: arbitrary_user_field_names_need_only_minimal_registration_meaning
    test: tests/test_data_registration.py::test_uc_data_001_minimal_registration_accepts_user_field_names
    inputs:
      fixture_kind: deterministic_contract
      reason: adversarial column names isolate field-name autonomy better than one vendor schema
      oracle: strict registration contract and catalog snapshot
    expected:
      registration: complete
      currency_required: false
      universe_required: false

  - id: UC-DATA-002
    case: requirement_discovered_then_resolved_without_replacing_registration
    test: tests/test_data_registration.py::test_uc_data_002_requirement_gap_is_progressive_and_retryable
    inputs:
      fixture_kind: deterministic_contract
      reason: two explicit registry states isolate progressive requirement resolution
      oracle: ComponentRequirement and RequirementResolver contract
    expected:
      first_resolution: failed
      original_registration_preserved: true
      enriched_resolution: complete

# Generic missing-horizon preflight remains in tests/test_pit_research.py but is not UC-PIT-001 closure evidence.

  - id: UC-ARTIFACT-002
    case: invalid_external_weight_payload_is_never_reusable
    test: tests/test_evidence.py::test_uc_artifact_002_invalid_external_payload_never_becomes_reusable
    inputs:
      fixture_kind: deterministic_contract
      reason: malformed serialized payload must be constructed explicitly
      oracle: strict Pydantic artifact contract and success catalog query
    expected:
      outcome: failed
      error_code: ARTIFACT_PAYLOAD_INVALID
      reusable_success_count: 0

  - id: UC-AGENT-001
    case: bundled_skill_explains_availability_candidates_and_lookahead
    test: tests/test_onboarding.py::test_uc_agent_001_codex_onboarding_installs_availability_guidance
    inputs:
      fixture_kind: deterministic_contract
      reason: agent guidance is a packaged text contract rather than market data behavior
      oracle: installed bundled skill content and onboarding fingerprint
    expected:
      explains_lookahead: true
      actual_release_candidate: true
      confirmed_delay_candidate: true
      source_enrichment_candidate: true

  - id: UC-COST-001
    case: exact_product_and_side_cost_rules
    test: tests/test_exchange_batch.py::test_uc_cost_001_exact_product_and_side_rules
    inputs:
      fixture_kind: deterministic_contract
      reason: economic branch fixtures require exact hand-derived values
      oracle: scalar branch calculation by product and side
    expected:
      exact_policy_selection: true
      silent_product_fallback: false

  - id: UC-COST-002
    case: effective_dated_cost_rule_selection
    test: tests/test_exchange_batch.py::test_uc_cost_002_effective_dated_rule
    inputs:
      fixture_kind: deterministic_contract
      reason: policy-boundary dates require controlled values on both sides of the cutoff
      oracle: scalar effective-time branch calculation
    expected:
      before_rule: old_policy
      after_rule: new_policy

  - id: UC-COST-003
    case: cash_clipping_and_fill_share_one_cost_calculator
    test: tests/test_exchange_batch.py::test_uc_cost_003_cash_clipping_uses_final_cost_calculator
    inputs:
      fixture_kind: deterministic_contract
      reason: clipping boundary requires a hand-derived cash and minimum-cost fixture
      oracle: scalar affordability equation including final fill cost
    expected:
      negative_cash: false
      clipping_cost_equals_fill_cost: true

  - id: UC-COST-004
    case: missing_etf_rule_cannot_fall_back_to_stock
    test: tests/test_exchange_batch.py::test_uc_cost_004_missing_etf_rule_does_not_fall_back_to_stock
    inputs:
      fixture_kind: deterministic_contract
      reason: the required behavior is an intentionally missing exact policy branch
      oracle: exact product-side-effective-time coverage validation
    expected:
      outcome: failed
      error_code: EXACT_COST_RULE_MISSING
      stock_fallback: false

  - id: UC-SCALE-001
    case: three_thousand_instrument_scalar_batch_parity
    test: tests/test_exchange_batch.py::test_uc_scale_001_three_thousand_names_keep_stable_batch_order
    inputs:
      fixture_kind: deterministic_contract
      reason: generated 3000-name axis gives exhaustive stable-order parity independent of vendor coverage
      oracle: scalar calculation for every element against compiled batch output
    expected:
      instrument_count: 3000
      scalar_batch_equal: true
      stable_output_order: true

  - id: UC-EXTENSION-002
    case: installed_local_strategy_validates_registers_and_executes_exact_id
    test: tests/test_strategy_extension_sample.py::test_uc_extension_002_installed_strategy_sample_validates_registers_and_executes
    inputs:
      fixture_kind: deterministic_contract
      reason: source drift, exact registration selection, and overwrite refusal require controlled package-owned files
      oracle: bundled installed-project sample using only curated top-level Strategy imports
    expected:
      validation: complete
      registration: append_only
      exact_execution: complete
      registration_lineage: true
      implicit_latest_selection: false

  - id: UC-ALPHA-PATH-001
    case: installed_frozen_path_dependent_composition_uses_downstream_account_authority
    test: tests/test_strategy_composition_sample.py::test_uc_alpha_path_001_installed_composition_preserves_source_lineage
    inputs:
      fixture_kind: deterministic_contract
      reason: distinct Account and Memory origins plus overwrite refusal require controlled package-owned files
      oracle: bundled installed-project sample using exact v2 member and registration artifact IDs
    expected:
      producer_rerun: false
      source_artifact_mutation: false
      complete_multi_source_lineage: true
      fabricated_singular_state_identity: false
      downstream_account_authority: sample-downstream-account-b

  - id: UC-TRIGGER-001
    case: strategy_declared_cadence_matches_daily_decision_times
    test: tests/test_public_daily.py::test_uc_trigger_001_public_daily_facade_enforces_declared_cadence
    inputs:
      fixture_kind: deterministic_contract
      reason: exact FIRE and SKIP timestamps require a controlled four-session calendar
      oracle: Strategy-owned EveryNSessions policy and persisted daily event trace
    expected:
      cadence: every_two_sessions
      decision_count: 2
      skipped_sessions_are_failures: false

  - id: UC-STATE-001
    case: zero_order_state_continues_only_with_explicit_seed
    test: tests/test_strategy_state.py::test_uc_state_001_zero_order_state_crosses_run_boundary_only_through_explicit_seed
    inputs:
      fixture_kind: deterministic_contract
      reason: zero-order HOLD and fresh-run isolation need an execution-independent fixture
      oracle: explicit initial and final strategy state values on DailyRunResult
    expected:
      zero_order_state_update: true
      explicit_seed_continues: true
      implicit_prior_state_selection: false

  - id: UC-ACCOUNT-HISTORY-001
    case: declared_account_series_and_instrument_panel_without_strategy_state
    test: tests/test_public_daily.py::test_uc_account_history_001_uses_declared_history_without_strategy_state
    inputs:
      fixture_kind: deterministic_contract
      reason: exact entry cost and realized PnL require controlled fills and marks
      oracle: declared recording spec, bounded Strategy requirements, and result lineage
    expected:
      account_series: [cash, nav, realized_pnl]
      instrument_panel: [quantity, average_cost, realized_pnl, mark]
      strategy_state_access: false
      unrecorded_inference: false
