[project]
name = "vqapr"
version = "0.1.0a12"
description = "Point-in-time quantitative research and portfolio execution framework"
readme = "README.md"
authors = [
    { name = "Jaepil.Choi", email = "chljeffreyz@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "cvxpy>=1.9,<2",
    "duckdb>=1.5,<2",
    "pandas>=3,<4",
    "pyarrow>=25,<26",
    "pydantic>=2.13,<3",
    "pytz>=2024.1",
    "pyyaml>=6,<7",
]

[project.scripts]
vqapr = "vqapr.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

# Layer boundaries are not enforced by an import-linter contract. See
# docs/vqapr-architecture.md §10.1 — module layout is non-normative (PRD §0.1), so a tool
# contract must not drive type placement. Every boundary that matters is enforced by the
# absence of a path (no account() on DataModelContext, no store handle outside flow/views,
# pure functions that take their inputs as arguments), and a misplaced type surfaces as a
# circular import, which Python reports without a tool.

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
strict_config = true
strict_markers = true
markers = [
    "real_data: requires an explicitly provisioned and versioned external dataset",
    "concurrency: exercises operating-system process, thread, or lock behavior",
    "uc: the PRD use-case ID this test protects, e.g. uc('UC-EXEC-001')",
    "slow: large-scale scenario such as UC-SCALE-001",
]

[tool.ruff]
exclude = [".agents", "attempts", "docs", "references"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
