[project]
name = "vqapr"
version = "0.11.0"
description = "Point-in-time quantitative research and portfolio execution framework"
readme = "README.md"
authors = [
    { name = "Jaepil.Choi", email = "chljeffreyz@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
# `cvxpy` and `pydantic` were listed here and imported nowhere in the repository -- a convex
# solver stack and a validation library on every `uv add vqapr`, reaching no shipped code path
# (record 129 removed both). `pydantic` is back since record 145 and is used: every section of
# the workspace document and the declaration document is a pydantic model
# (`vqapr.workspace_document`), which replaced ~1,100 lines of hand-written key-set, type, enum
# and timestamp checks. It is not used on any hot path.
# `pandas` was listed as a runtime dependency while only a test and a fixture script import it,
# so it moved to the dev group.
#
# `pytz` stays, and the reason is worth writing down because grep says it should not. Nothing in
# `src/vqapr` imports it; **duckdb does**, at runtime, and does not declare it. Dropping it turns
# reads of a timestamptz column into
# `InvalidInputException: Required module 'pytz' failed to import`, raised from inside duckdb
# rather than from any import statement here -- which is why a static search reports it unused.
# It is our dependency because our dependency will not declare its own.
dependencies = [
    "duckdb>=1.5,<2",
    # `numpy` is the panel's matrix (record `232`): a field is one `(instants x instruments)`
    # block a model computes on. pyarrow already required it; naming it is naming what we use.
    "numpy>=2,<3",
    "pyarrow>=25,<26",
    "pydantic>=2,<3",
    "pytz>=2024.1",
    "pyyaml>=6,<7",
]

[project.scripts]
vqapr = "vqapr.cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# `pandas` is here rather than in `dependencies` because it is a fixture-building tool, not a
# runtime one: `tests/acceptance/test_figure_03_neutralization.py` and
# `scripts/extract_report_figure_03_fixture.py` are its only importers in the repository.
# The package's own numeric work is Decimal and duckdb.
dev = [
    "pandas>=3,<4",
    "pyright>=1.1.411,<2",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "vulture>=2.14,<3",
]

# Layer boundaries are not enforced by an import-linter contract. See
# docs/vqapr-architecture.md §10.1 — module layout is non-normative (PRD §0.1), so a tool
# contract must not drive type placement. Every boundary that matters is enforced by the
# absence of a path (no account() on DataModelContext, no store handle outside flow/engine,
# pure functions that take their inputs as arguments).
#
# This comment used to end "and a misplaced type surfaces as a circular import, which Python
# reports without a tool". That half was false and is retired (record 198). The layering
# campaign measured four package cycles at 0.8.0 and Python reported none of them: two were
# deferred into function bodies, one was held open by a TYPE_CHECKING import, and one was
# module-level in both directions and merely happened to load in a working order. A fifth --
# extension writing to the workspace it sits below — was found only once the layers were
# written down.
#
# What replaces it is not a contract file: it is tests/boundaries/test_the_layers_hold.py,
# which declares the altitude of every package and fails on an import that reaches its own
# layer or above. The first argument above still stands, which is why the table is a test in
# this repository's own idiom rather than a tool's config.

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# The repo root, so `tests.<package>.support` helpers import the same under `uv run pytest` as
# under `python -m pytest` (which puts the cwd on sys.path by itself).
pythonpath = ["."]
strict_config = true
strict_markers = true
# `slow` is deselected by default. Fourteen end-to-end journeys are ~80% of a 420s suite while
# the other ~1,300 tests are ~88s combined, which made the edit-check loop cost minutes and made
# people run the suite less often -- the opposite of what a suite is for.
#
# Nothing is deleted and nothing is skipped conditionally: `-m slow` runs exactly those, and
# `-m ""` runs everything. CI and any pre-release check should use the latter.
addopts = "-m 'not slow'"
markers = [
    "real_data: requires an explicitly provisioned and versioned external dataset",
    "concurrency: exercises operating-system process, thread, or lock behavior",
    "uc: the PRD use-case ID this test protects, e.g. uc('UC-EXEC-001')",
    "slow: large-scale scenario such as UC-SCALE-001",
]

[tool.ruff]
exclude = [".agents", "attempts", "docs", "references"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A vulture whitelist is a list of bare names, which is exactly what F821 and B018 exist to
# catch. The file is never imported and never run; it is input to vulture's own parser.
"scripts/vulture_whitelist.py" = ["F821", "B018"]

# Cross-module dead-code pass. `ruff` is file-local by construction -- F401 and F841 see one
# module at a time -- so nothing in the configured rule set can answer "is this method called
# anywhere". Vulture reads names across the tree, which is the whole graph a deletion decision
# needs and also the reason it misfires on protocol methods, string-resolved registries, and
# dataclass fields. `scripts/vulture_whitelist.py` carries exactly those, each with its caller
# named, so a report from this command is a finding rather than a re-triage.
#
# Passing `tests` is deliberate: with it, the report is "nothing calls this at all"; without it,
# the report is "only tests call this", and the difference between those two is the decision.
[tool.vulture]
paths = ["src", "tests", "scripts/vulture_whitelist.py"]
min_confidence = 60
# A fixture is requested by name, never called, so every one of them reads as dead.
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.fixture(*)",
    # pydantic hooks are called by the model, never by name.
    "@model_validator",
    "@model_validator(*)",
    "@field_validator",
    "@field_validator(*)",
    "@model_serializer",
    "@model_serializer(*)",
    "@field_serializer",
    "@field_serializer(*)",
]
# `model_config` is pydantic's class-level configuration attribute.
ignore_names = ["model_config"]

# Static type gate (redesign campaign 2026-09-08, step 0). `src/` only: tests and scripts are
# not the contract. `basic` first so the count of findings is a measurement the campaign
# drives down; `strict` is the target once the Component/EventLoop generics land.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
