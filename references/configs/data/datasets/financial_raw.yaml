datasets:
  # 아래 fng_statement_items query의 공통 WHERE 계약:
  # - statement_scope='consolidated'/'separate'는 각각 연결/별도 원천 table row를 고른다.
  # - settlement_type='D'는 FY 누적 row만 고른다(1~4는 분기 standalone,
  #   A/B/C는 Q1/H1/Q1~Q3 누적이며 scope 구분 code가 아니다).
  # - account_code는 dataset 이름에 대응하는 exact FNG 원천 계정만 고른다.
  # 즉 아래 matrix는 최신 TTM이나 분기값이 아니라 FY 누적값에 3개월 lag를 붙인 계약이다.

  financial_c_total_assets:
    kind: matrix
    sources: [fng_statement_items]
    query: |
      select last_day(fiscal_period) + interval '3 months' as available_date,
             ticker,
             numeric_value as total_assets
      from fng_statement_items
      -- 연결 FY 누적 자산총계 계정만 선택한다.
      where statement_scope = 'consolidated'
        and settlement_type = 'D'
        and account_code = '4001110000'
    index: available_date
    columns: ticker
    values: total_assets
    dtype: float64

  financial_c_total_liabilities:
    kind: matrix
    sources: [fng_statement_items]
    query: |
      select last_day(fiscal_period) + interval '3 months' as available_date,
