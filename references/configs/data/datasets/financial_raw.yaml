  # EPS 산식:
  #   EPS = 재무제표의 *당기순이익 * 1000 / 연별지표계산의 주식수평균
  # FNG 재무데이타는 천원 단위이고, EPS는 원 단위이므로 numerator에 1000을 곱한다.
  # 분모는 보통주주식수평균 + 우선주주식수평균을 이미 합산한 average_total_shares다.
  # 연결 EPS numerator는 4001167200, 별도 EPS numerator는 1001167200이다.

  financial_annual_average_common_shares:
    kind: matrix
    sources: [fng_annual_share_counts]
    query: |
      select
        last_day(base_date) + interval '3 months' as available_date,
        ticker,
        average_common_shares
      from fng_annual_share_counts
    index: available_date
    columns: ticker
    values: average_common_shares
    dtype: float64

  financial_annual_average_preferred_shares:
    kind: matrix
    sources: [fng_annual_share_counts]
    query: |
      select
        last_day(base_date) + interval '3 months' as available_date,
        ticker,
        average_preferred_shares
      from fng_annual_share_counts
    index: available_date
    columns: ticker
    values: average_preferred_shares
    dtype: float64

  financial_annual_average_total_shares:
    kind: matrix
    sources: [fng_annual_share_counts]
    query: |
      select
        last_day(base_date) + interval '3 months' as available_date,
        ticker,
        average_total_shares
      from fng_annual_share_counts
    index: available_date
    columns: ticker
    values: average_total_shares
    dtype: float64

  financial_daily_ending_common_shares:
