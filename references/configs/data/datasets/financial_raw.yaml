  # Dividend datasets:
  # - dividend_type_1='10' and dividend_type_2='20' is the ordinary-share row
  #   confirmed by FNG dividend source discovery for Samsung Electronics.
  # - dividend_yield is daily because price changes daily. It uses the latest
  #   fiscal DPS available at or before each price date.

  financial_dividend_cash_dps:
    kind: matrix
    sources: [fng_dividend_items]
    query: |
      select
        last_day(fiscal_period) + interval '3 months' as available_date,
        ticker,
        minority_cash_dps
      from fng_dividend_items
      where dividend_type_1 = '10'
        and dividend_type_2 = '20'
    index: available_date
    columns: ticker
    values: minority_cash_dps
    dtype: float64

  financial_dividend_total_amount:
    kind: matrix
    sources: [fng_dividend_items]
    query: |
      select
        last_day(fiscal_period) + interval '3 months' as available_date,
        ticker,
        total_dividend_amount
      from fng_dividend_items
      where dividend_type_1 = '10'
        and dividend_type_2 = '20'
    index: available_date
    columns: ticker
    values: total_dividend_amount
    dtype: float64
