  # 적용일자 event matrix다. daily 사용 시 DataFeed에서 latest available row를 명시적으로
  # 구독해야 하며, 보통주식지분의 source semantic은 전략 승격 전 별도 검증한다.
  # 아래 query에는 WHERE가 없으므로 event와 값의 부호/크기를 임의로 필터하지 않는다.
  fng_non_free_float_shares:
    kind: matrix
    sources: [fng_free_float_ratio]
    query: |
      select strptime(trim("적용일자"), '%Y%m%d')::date as effective_date,
             trim("종목약코드") as ticker,
             cast(nullif(replace(trim("비유동주식수"), ',', ''), '') as double) as value
