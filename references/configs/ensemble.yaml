      - name: gap_exhaustion
        strategy_key: sector_adjusted_gap_exhaustion.fade
      - name: ranked_information_drift
        strategy_key: information_momentum.ranked_one_week_drift
    cash_frame:
      alpha_multiplier: 1.0
      buffer_budget:
        base: 0.0
        band_lower: -0.65
        band_upper: 0.65
        physical_lower: -1.0
        physical_upper: 1.0
        lower_softening_scale: 0.35
        upper_softening_scale: 0.35

  price_alpha_risk_adjusted_return_momentum:
