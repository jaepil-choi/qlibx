name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Force Python's UTF-8 mode globally on every runner. Eliminates a
      # whole class of cp1252 / charmap codec errors on Windows for any
      # library code that prints Unicode glyphs (`→`, `✓`, em-dashes)
      # or reads source/markdown files. Has been a stable Python feature
      # since 3.7. Equivalent to passing `-X utf8`.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # `-ra` is NOT cosmetic. A public checkout has no artifact store, so every
        # store-dependent falsifier resolves to SKIP — which is correct, and which is
        # invisible in a bare `-q` summary. Nine of these once skipped against a path that
        # could never exist and nobody noticed, because a skip is indistinguishable from a
        # pass in a suite total. `-ra` prints every skip and its reason, so a reader of a
        # green run can see exactly what did not execute.
        run: pytest tests/ -q -ra --ignore=tests/live
