[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib-extended"
version = "0.1.0"
description = "Config-driven Qlib research runs with deterministic artifact lineage"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "protobuf==3.20.3",
    "pyarrow>=24.0.0",
    "pyqlib>=0.9.7",
    "pyyaml>=6.0.3",
    "setuptools<81",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "qlib_extended*",
    "kwam_qlib_backend*",
    "report_twin*",
]
