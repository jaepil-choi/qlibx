scenarios:
  - id: UC-SIGNAL-001
    case: direct_real_dw_signal_and_weight_research
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_001_and_uc_constraint_001_complete_direct_real_dw_research
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      operation: direct_strategy
    expected:
      outcome: complete
      stored_signal_required: false
      portfolio_required: false
      execution_required: false
      account_mutation: false
      memory_mutation: false

  - id: UC-CONSTRAINT-001
    case: direct_real_dw_research_without_compliance_capability
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_001_and_uc_constraint_001_complete_direct_real_dw_research
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      selected_constraints: []
    expected:
      outcome: complete
      compliance_dataset_required: false
      constraint_artifact_created: false
      account_mutation: false
      memory_mutation: false

  - id: UC-ERROR-001
    case: missing_realized_return_fails_at_actual_analysis_path
    test: tests/acceptance/test_analysis_scenarios.py::test_uc_error_001_and_uc_research_001_short_analysis_fails_then_retries
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      source_artifact: stored_signal_result
      missing_requirement: analysis_return
    expected:
      failure_stage: analysis.run.requirements.analysis_return
      model_stage_created: false
      portfolio_stage_created: false
      order_stage_created: false
      account_mutation: false
      memory_mutation: false

  - id: UC-RESEARCH-001
    case: failed_signal_analysis_is_preserved_then_resolved
    test: tests/acceptance/test_analysis_scenarios.py::test_uc_error_001_and_uc_research_001_short_analysis_fails_then_retries
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      source_artifact: stored_signal_result
      retry_binding: analysis_return
    expected:
      failure_preserved: true
      retry_outcome: complete
      resolves_error_lineage: true
      metric_set: [signal_count, information_coefficient, hypothetical_long_short_return]
      account_mutation: false
      memory_mutation: false

  - id: UC-EXTENSION-001
    case: project_local_sector_demean_validated_before_registration
    test: tests/acceptance/test_extension_scenarios.py::test_uc_extension_001_registers_only_after_real_pit_contract_validation
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/DW_FNG_FGSC종목_20200101-20260430.csv
        - data/preprocessed/adjusted_prices.parquet
        - data/preprocessed/sector_classification.parquet
        - data/preprocessed/industry_mapping.parquet
      available_at_rule: next_trading_session_at_09_00_kst
      extension_owner: project_local
      contract: neutralization_transform_v1
    expected:
      before_available_at: failed
      invalid_output: failed
      failure_registered: false
      deterministic_output: true
      group_sum_zero: true
      validated_registered: true

  - id: UC-REPORT-001
    case: one_stored_analysis_three_value_preserving_renderers
    test: tests/acceptance/test_reporting_scenarios.py::test_uc_report_001_renderers_preserve_one_stored_analysis_value_set
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
      stored_inputs:
        - simulation_checkpoint
        - execution_result
      renderers: [table, chart, machine]
    expected:
      analysis_recalculation_per_renderer: false
      value_fingerprint_equal: true
      account_mutation: false
      memory_mutation: false

  - id: UC-MONITOR-001
    case: actual_breach_and_missing_input_are_distinct_report_records
    test: tests/acceptance/test_reporting_scenarios.py::test_uc_monitor_001_report_separates_actual_breach_and_missing_input
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
      stored_inputs:
        - constraint_monitoring_result
        - operation_error
    expected:
      breach_count: 1
      missing_input_count: 1
      intended_target_as_actual: false
      account_mutation: false
      memory_mutation: false

  - id: UC-LOOKTHROUGH-001
    case: same_real_etf_opaque_or_user_mapped
    test: tests/acceptance/test_lookthrough_scenarios.py::test_uc_lookthrough_001_is_user_declared_while_same_etf_stays_opaque
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
        - data/Dataguide/데이터가이드K200ETF들_20200101-20260430.csv
        - data/preprocessed/k200_etf_prices.parquet
      available_at_rule: next_trading_session_at_09_00_kst
      mapping_owner: user_strategy
    expected:
      opaque_dataset_access: false
      explicit_dataset_access: true
      package_lookthrough_artifact: false
      account_mutation: false
      memory_mutation: false

  - id: UC-LOOKTHROUGH-002
    case: future_real_k200_constituent_row_hidden
    test: tests/acceptance/test_lookthrough_scenarios.py::test_uc_lookthrough_002_hides_future_real_constituent_observation
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
      snapshot_policy: user_selected_subset_renormalized
    expected:
      early_visible_observation: 2024-01-02
      early_hidden_observation: 2024-01-03
      later_visible_observation: 2024-01-03
      automatic_latest_fallback: false

  - id: UC-LOOKTHROUGH-003
    case: committed_actual_recomputed_against_strategy_memory_target
    test: tests/acceptance/test_lookthrough_scenarios.py::test_uc_lookthrough_003_recomputes_actual_instead_of_memory_target
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
        - data/Dataguide/데이터가이드K200ETF들_20200101-20260430.csv
        - data/preprocessed/k200_etf_prices.parquet
      available_at_rule: next_trading_session_at_09_00_kst
      intended_state_source: strategy_memory
      actual_state_source: committed_account_snapshot
    expected:
      actual_exposure: {A012330: 0.4, A373220: 0.2}
      memory_target_exposure: {A012330: 0.65, A373220: 0.35}
      intended_as_actual: false
      account_mutation: false
      memory_mutation: false

  - id: UC-EXEC-003
    case: real_no_trade_price_drift_finding_only
    test: tests/acceptance/test_research_scenarios.py::test_uc_exec_003_monitors_real_no_trade_price_drift_without_mutation
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      outcome: complete
      decision_created: false
      order_created: false
      account_mutation: false
      memory_mutation: false
      breach_published: true

  - id: UC-CONSTRAINT-002
    case: missing_or_future_k200_weight_fails_before_mutation
    test: tests/acceptance/test_research_scenarios.py::test_uc_constraint_002_and_uc_constraint_adjust_001_use_confirmed_k200_cutoff
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      missing_binding: failed
      before_available_at: failed
      account_mutation: false
      memory_mutation: false

  - id: UC-CONSTRAINT-ADJUST-001
    case: real_k200_cap_lot_residual_then_independent_deny
    test: tests/acceptance/test_research_scenarios.py::test_uc_constraint_002_and_uc_constraint_adjust_001_use_confirmed_k200_cutoff
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      adjustment_outcome: complete
      unresolved_excess: positive
      validation_outcome: complete
      execution_eligible: false
      account_mutation: false
      memory_mutation: false

  - id: UC-PORTFOLIO-001
    case: real_dw_same_alpha_two_current_profiles
    test: tests/acceptance/test_research_scenarios.py::test_uc_portfolio_001_constructs_two_portfolios_from_one_real_dw_alpha
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      source_artifact: signed_alpha
      profiles: [hypothetical_signed, equity_long_only]
    expected:
      outcome: complete
      source_alpha_mutation: false
      signed_gross: 1.0
      signed_net: 0.0
      long_only_gross: 0.5
      long_only_net: 0.5
      long_only_cash_residual: 0.5

  - id: UC-CLOSED-LOOP-001
    case: real_dw_daily_feedback
    test: tests/acceptance/test_execution_scenarios.py::test_uc_closed_loop_001_and_uc_exec_002_real_dw_daily
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      account_mutation: flow_commit_only
      memory_mutation: flow_commit_only

  - id: UC-EXEC-002
    case: real_dw_next_close_limitations
    test: tests/acceptance/test_execution_scenarios.py::test_uc_closed_loop_001_and_uc_exec_002_real_dw_daily
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      fill_price: 77000
      dealt_quantity: 129

  - id: UC-ALPHA-ADAPTIVE-001
    case: confirmed_feedback_memory_commit
    test: tests/acceptance/test_execution_scenarios.py::test_uc_alpha_adaptive_001_memory_commits_only_after_feedback
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      memory_mutation: flow_commit_after_feedback
      feedback_cursor: 2

  - id: UC-EXEC-001
    case: frozen_daily_children
    test: tests/acceptance/test_execution_scenarios.py::test_uc_exec_001_isolates_frozen_daily_children
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      parent_mutation: false
      child_account_isolation: true

# UC-ALPHA-CHILD-001 is excluded below until real next-close/next-open closure evidence exists.



  - id: UC-SIGNAL-002
    case: external_real_dw_signal_two_consumers
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_002_and_uc_artifact_001_reuse_real_dw_stored_signal
    inputs:
