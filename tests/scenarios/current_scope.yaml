schema_version: 1
suite: qlibx-current-scope
support_status: current
coverage_sets:
  m5:
    - UC-EXEC-001
    - UC-SIGNAL-002
    - UC-ALPHA-BUDGET-001
    - UC-ALPHA-PATH-001
    - UC-ALPHA-CHILD-001
    - UC-ALPHA-ADAPTIVE-001
    - UC-ENSEMBLE-001
    - UC-ARTIFACT-001
  m6_portfolio:
    - UC-PORTFOLIO-001
  m6_constraint:
    - UC-CONSTRAINT-002
    - UC-CONSTRAINT-ADJUST-001
  m6_monitoring:
    - UC-EXEC-003
scenarios:
  - id: UC-EXEC-003
    case: real_no_trade_price_drift_finding_only
    test: tests/acceptance/test_research_scenarios.py::test_uc_exec_003_monitors_real_no_trade_price_drift_without_mutation
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      outcome: complete
      decision_created: false
      order_created: false
      account_mutation: false
      memory_mutation: false
      breach_published: true

  - id: UC-CONSTRAINT-002
    case: missing_or_future_k200_weight_fails_before_mutation
    test: tests/acceptance/test_research_scenarios.py::test_uc_constraint_002_and_uc_constraint_adjust_001_use_confirmed_k200_cutoff
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      missing_binding: failed
      before_available_at: failed
      account_mutation: false
      memory_mutation: false

  - id: UC-CONSTRAINT-ADJUST-001
    case: real_k200_cap_lot_residual_then_independent_deny
    test: tests/acceptance/test_research_scenarios.py::test_uc_constraint_002_and_uc_constraint_adjust_001_use_confirmed_k200_cutoff
    inputs:
      data_kind: real
      sources:
        - data/DW/fng_stock_daily_prices.csv
        - data/DW/fng_k200_members.csv
        - data/preprocessed/k200_members.parquet
      available_at_rule: next_trading_session_at_09_00_kst
    expected:
      adjustment_outcome: complete
      unresolved_excess: positive
      validation_outcome: complete
      execution_eligible: false
      account_mutation: false
      memory_mutation: false

  - id: UC-PORTFOLIO-001
    case: real_dw_same_alpha_two_current_profiles
    test: tests/acceptance/test_research_scenarios.py::test_uc_portfolio_001_constructs_two_portfolios_from_one_real_dw_alpha
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      source_artifact: signed_alpha
      profiles: [hypothetical_signed, equity_long_only]
    expected:
      outcome: complete
      source_alpha_mutation: false
      signed_gross: 1.0
      signed_net: 0.0
      long_only_gross: 1.0
      long_only_net: 1.0

  - id: UC-CLOSED-LOOP-001
    case: real_dw_daily_feedback
    test: tests/acceptance/test_execution_scenarios.py::test_uc_closed_loop_001_and_uc_exec_002_real_dw_daily
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      account_mutation: flow_commit_only
      memory_mutation: flow_commit_only

  - id: UC-EXEC-002
    case: real_dw_next_close_limitations
    test: tests/acceptance/test_execution_scenarios.py::test_uc_closed_loop_001_and_uc_exec_002_real_dw_daily
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      fill_price: 77000
      dealt_quantity: 129

  - id: UC-ALPHA-ADAPTIVE-001
    case: confirmed_feedback_memory_commit
    test: tests/acceptance/test_execution_scenarios.py::test_uc_alpha_adaptive_001_memory_commits_only_after_feedback
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      memory_mutation: flow_commit_after_feedback
      feedback_cursor: 2

  - id: UC-EXEC-001
    case: frozen_daily_children
    test: tests/acceptance/test_execution_scenarios.py::test_uc_exec_001_and_uc_alpha_child_001_isolate_frozen_daily_children
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      parent_mutation: false
      child_account_isolation: true

  - id: UC-ALPHA-CHILD-001
    case: frozen_daily_children
    test: tests/acceptance/test_execution_scenarios.py::test_uc_exec_001_and_uc_alpha_child_001_isolate_frozen_daily_children
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      strategy_rerun: false
      memory_mutation: false
      parent_mutation: false

  - id: GAP-RECOVERY-001
    case: account_memory_checkpoint_resume
    test: tests/acceptance/test_execution_scenarios.py::test_gap_recovery_001_account_and_memory_checkpoint_resume
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      duplicate_commit: false
      feedback_cursor: 2
      uninterrupted_parity: true

  - id: UC-SIGNAL-002
    case: external_real_dw_signal_two_consumers
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_002_and_uc_artifact_001_reuse_real_dw_stored_signal
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      producer_rerun: false
      consumer_count: 2

  - id: UC-ALPHA-BUDGET-001
    case: real_dw_flexible_residual_fixed_rejection
    test: tests/acceptance/test_research_scenarios.py::test_uc_alpha_budget_001_preserves_real_dw_flexible_residual
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      invested_gross: 0.4
      residual_budget: 0.6
      fixed_consumer: failed

  - id: UC-ARTIFACT-001
    case: external_real_dw_signal_round_trip
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_002_and_uc_artifact_001_reuse_real_dw_stored_signal
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      typed_load: true
      producer_import: false

  - id: UC-ENSEMBLE-001
    case: stored_member_crossing
    test: tests/acceptance/test_research_scenarios.py::test_uc_ensemble_001_records_crossing_budget_and_member_lineage
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      gross_before: 1.0
      gross_after: 0.0
      residual_budget: 1.0

  - id: UC-ALPHA-PATH-001
    case: child_memory_rerun_or_frozen_replay
    test: tests/acceptance/test_research_scenarios.py::test_uc_alpha_path_001_uses_child_memory_for_rerun_or_frozen_intent_for_replay
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
      rerun_state: account_b_and_child_memory_b
      replay_input: parent_decision_intent
    expected:
      outcome: complete
      new_assessment_model: false
      rerun_uses_child_memory: true
      replay_strategy_rerun: false
      replay_memory_mutation: false
