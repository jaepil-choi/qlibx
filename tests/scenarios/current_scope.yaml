      producer_rerun: false
      consumer_count: 2

  - id: UC-ALPHA-BUDGET-001
    case: real_dw_flexible_residual_fixed_rejection
    test: tests/acceptance/test_research_scenarios.py::test_uc_alpha_budget_001_preserves_real_dw_flexible_residual
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      invested_gross: 0.4
      residual_budget: 0.6
      fixed_consumer: failed

  - id: UC-ARTIFACT-001
    case: external_real_dw_signal_round_trip
    test: tests/acceptance/test_research_scenarios.py::test_uc_signal_002_and_uc_artifact_001_reuse_real_dw_stored_signal
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      typed_load: true
      producer_import: false

  - id: UC-ENSEMBLE-001
    case: stored_member_crossing
    test: tests/acceptance/test_research_scenarios.py::test_uc_ensemble_001_records_crossing_budget_and_member_lineage
    inputs:
      data_kind: real
      sources: [data/DW/fng_stock_daily_prices.csv]
    expected:
      outcome: complete
      gross_before: 1.0
      gross_after: 0.0
      residual_budget: 1.0

excluded_readiness_gaps:
  - id: GAP-MATERIALIZATION-PIT-001
    excludes_current_use_case: UC-PIT-001
    reason: generic Strategy requirement ordering does not prove a real forward-label Model materialization boundary
    closure_oracle: optional materialization fails on missing horizon before calculation or mutation, then succeeds with a valid PIT label horizon
  - id: GAP-EXECUTION-CONVENTION-001
    excludes_current_use_case: UC-ALPHA-CHILD-001
    reason: next-close participation-rate children do not prove a next-open schedule and price convention
    closure_oracle: one frozen real-PIT parent executes next-close and next-open without Strategy rerun, with isolated child Account and lineage
  - id: GAP-STRATEGY-COMPOSITION-001
    excludes_current_use_case: UC-ALPHA-PATH-001
    reason: decision-intent replay does not prove frozen Strategy-result composition
    closure_oracle: producer non-rerun, parent immutability, and complete multi-source state/cursor lineage
